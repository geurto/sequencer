# Only options rustfmt accepts on the stable channel. The previous file was a
# dump of `rustfmt --print-config default`, which set ~30 nightly-only options
# and printed a warning for each on every run.
edition = "2021"
style_edition = "2021"

max_width = 80

# The width heuristics below are rustfmt's defaults for max_width = 100 rather
# than 80. They are kept explicit because the existing source is formatted to
# them; drop them to fall back to values derived from max_width.
fn_call_width = 60
attr_fn_like_width = 70
struct_lit_width = 18
struct_variant_width = 35
array_width = 60
chain_width = 60
single_line_if_else_max_width = 50
single_line_let_else_max_width = 50
