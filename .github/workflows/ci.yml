name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # alsa-sys (midir) and x11 (device_query) both locate their libraries
      # through pkg-config at build time.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # seq-core and seq-ui must keep building for a bare-metal target with no
  # default features — this is what guarantees they stay no_std and
  # allocation-free as they grow. riscv32imc is a tier-2 target and also the
  # ESP32-C2/C3 architecture.
  no-std:
    name: core crates build bare-metal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf

      - uses: Swatinem/rust-cache@v2

      - name: Check no_std
        run: >
          cargo check -p seq-core -p seq-ui
          --target riscv32imc-unknown-none-elf
          --no-default-features --locked

  msrv:
    name: build on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in step with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev

      - name: Check
        run: cargo check --workspace --all-targets --locked
