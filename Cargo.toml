[package]
name = "sequencer"
version = "0.1.0"
edition = "2021"
# Highest MSRV declared anywhere in the resolved dependency graph. Nothing in
# this crate's own source needs anything newer than 1.85.
rust-version = "1.87"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.86"
device_query = "2.1.0"
env_logger = "0.11.3"
iced = { version = "0.13.1", features = ["advanced", "canvas", "tokio"] }
iced_futures = "0.13.2"
log = "0.4.22"
midir = "0.11.0"
num = "0.4.3"
rand = "0.9.1"
tokio = { version = "1.36.0", features = ["full"] }

[dev-dependencies]
proptest = "1.11.0"

[profile.release]
lto = "thin"
codegen-units = 1
# Abort rather than unwind: a panicking playback task should fail loudly instead
# of silently disappearing (spawned JoinHandles are dropped).
panic = "abort"
